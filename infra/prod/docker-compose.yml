name: bonn-prod

services:
  db:
    image: postgres:17-alpine
    container_name: bonn-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Falta DB_NAME en infra/prod/.env}
      POSTGRES_USER: ${DB_USER:?Falta DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../backend
      target: production
    container_name: bonn-prod-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      IGNORE_ENV_FILE: "true"
      PORT: 3000
    volumes:
      - storage:/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    build:
      context: ../../frontend
      target: production
    container_name: bonn-prod-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8200}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/storage:ro      
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:     
  storage:    
