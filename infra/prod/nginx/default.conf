# nginx de producción: sirve el frontend, redirige /api a la API y entrega los archivos que la API autoriza.

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Frontend (SPA)
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Los archivos compilados llevan un hash en el nombre: se pueden guardar en caché mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 600m;          # tamaño máximo de subida [P-10]
        proxy_read_timeout 300s;            # subidas grandes y reportes
    }

    # Archivos protegidos (videos, PDF, imágenes).
    # "internal": el navegador NO puede pedir esta ruta directamente.
    # Solo se usa cuando la API, después de revisar el permiso, responde con X-Accel-Redirect (T-06).
    location /_protegido/ {
        internal;
        alias /storage/;
    }
}
